#:schema https://mago.carthage.software/1.45.0/schema.json
# Welcome to Mago!
# For full documentation, see https://mago.carthage.software/1.45.0/en/tools/overview/
version = "1"
php-version = "8.5.0"

[source]
workspace = "."
paths = ["src/"]
includes = ["vendor"]
excludes = []

[source.glob]
literal-separator = true

[formatter]
preset = "default"

[linter]
integrations = ["pest"]

[linter.rules]
ambiguous-function-call = { enabled = false }
literal-named-argument = { enabled = false }
halstead = { effort-threshold = 7000 }
cyclomatic-complexity = { threshold = 45 }
kan-defect = { threshold = 4.5 }
too-many-methods = { threshold = 30 }

[analyzer]
plugins = []
ignore = [
    # $num is validated >= 1 by enoughCards() before the array_rand call
    { code = "possibly-invalid-argument", pattern = "array_rand", in = ["src/Stack.php"] },
    # Constructor validates iterable<mixed, mixed> items via instanceof at runtime
    { code = "mixed-assignment", in = ["src/Stack.php"] },
    # $flat is built from array_keys() string values, never null
    { code = "possibly-null-array-index", in = ["src/RankOrder.php"] },
    # 5-card hand guarantees non-empty; array_unique loses the non-empty proof
    { code = "invalid-return-statement", pattern = "non-empty-list", in = ["src/Games/Poker/PokerHand.php"] },
]
find-unused-definitions = true
find-unused-expressions = false
analyze-dead-code = false
memoize-properties = true
allow-possibly-undefined-array-keys = true
check-throws = false
unchecked-exceptions = ["Error", "LogicException"]
unchecked-exception-classes = []
check-missing-override = false
find-unused-parameters = false
strict-list-index-checks = false
strict-array-index-existence = false
allow-array-truthy-operand = false
no-boolean-literal-comparison = false
check-missing-type-hints = false
register-super-globals = true